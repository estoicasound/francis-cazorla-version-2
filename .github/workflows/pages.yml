name: Publicar Francis Cazorla · Versión 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar solo los archivos públicos
        run: |
          mkdir _site
          cp index.html privacidad.html robots.txt sitemap.xml .nojekyll _site/
          cp -R css js assets _site/
          rm -f _site/assets/img/manifest.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar sitio independiente
        id: deployment
        uses: actions/deploy-pages@v4
